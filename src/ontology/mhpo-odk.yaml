## ontology metadata ##
id: mhpo
title: Municipal Heat Planning Ontology
description: "The municipal heat planning ontology (MHPO) is a domain reference ontology that covers the relevant terminology for the German 'Kommunale Wärmeplanung'. Community heat planning in Germany is a structured process in which municipalities and cities plan their future heat supply based on energy demand, existing infrastructure, and climate protection goals. The aim is to reduce greenhouse gas emissions and heat consumption, increase the use of renewable energy, decrease dependence on fossil fuels and improve resilience of the system. The planning is typically carried out within the framework of climate protection programs and is supported by federal funding. The primary use case of MHPO is to describe data and metadata of the heat plans."
contact:  mirjam.stappel [at] uni-osnabrueck [.] de
license: http://creativecommons.org/publicdomain/zero/1.0/
license: https://opensource.org/license/mit

## general ODK Settings ##
github_org: OpenEnergyPlatform
repo: municipal-heat-planning-ontology
git_main_branch: production
uribase: https://purl.org/mhpo/ontology 
reasoner: HermiT
components:
  base_iris: https://purl.org/mhpo/ontology/mhpo.owl
  create_obo_metadata: false
  dosdp_tools_options: --prefixes=mhpo_prefixes.yaml
release_artefacts:
  - base
  - full
primary_release: full
export_formats:
  - owl
  - json
import_group:
  products:
    - id: bfo
    - id: iao
      mirror_from: https://raw.githubusercontent.com/information-artifact-ontology/IAO/v2026-03-30/iao.owl
    - id: oeo
      mirror_from: https://openenergyplatform.org/ontology/oeo/
      module_type: custom
robot_java_args: "-Xmx8G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
documentation:
  documentation_system: mkdocs