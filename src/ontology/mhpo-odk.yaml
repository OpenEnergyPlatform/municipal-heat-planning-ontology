id: mhpo
title: "Municipal Heat Planning Ontology"
github_org: OpenEnergyPlatform
git_main_branch: main
repo: municipal-heat-planning-ontology
uribase: https://purl.org/mhpo/ontology 
components:
  base_iris: https://purl.org/mhpo/ontology/mhpo.owl
  create_obo_metadata: false
  dosdp_tools_options: --prefixes=mhpo_prefixes.yaml
release_artefacts:
  - base
  - full
  - simple
primary_release: full
export_formats:
  - owl
  - json
import_group:
  products:
    - id: bfo
    - id: iao
    - id: oeo
      mirror_from: https://openenergyplatform.org/ontology/oeo/
robot_java_args: "-Xmx8G"
robot_report:
  use_labels: TRUE
  fail_on: ERROR
  custom_profile: TRUE
  report_on:
    - edit
documentation:
  documentation_system: mkdocs